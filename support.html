<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support LocalGames</title>
<style>
  :root { --bg: #f6f7fb; --card: #ffffff; --text: #1d2433; --muted: #5b6475; --accent: #c8691c; --accent-text: #ffffff; --line: #e2e6ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --card: #1c212b; --text: #e8ecf4; --muted: #a3acbd; --accent: #f0a04b; --accent-text: #1a1206; --line: #2c3340; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  ul { margin: 0 0 20px; padding-left: 20px; }
  li { margin: 4px 0; }
  .btn { display: block; text-align: center; background: var(--accent); color: var(--accent-text); text-decoration: none;
         font-weight: 700; border-radius: 12px; padding: 14px 16px; min-height: 48px; }
  .note { font-size: 0.9rem; margin-top: 14px; }
  .langs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .langs a { color: var(--muted); padding: 10px 8px; min-height: 44px; }
  .langs a.on { color: var(--text); font-weight: 700; }
  .cup { width: 48px; height: 48px; color: var(--accent); margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c0 1.2 1 1.2 1 2.4M12 3c0 1.2 1 1.2 1 2.4"/>
    </svg>
    <h1 data-k="title"></h1>
    <p data-k="intro"></p>
    <ul>
      <li data-k="p1"></li>
      <li data-k="p2"></li>
      <li data-k="p3"></li>
    </ul>
    <a class="btn" id="bmc" href="https://buymeacoffee.com/simpleandsmallapps" rel="noopener" data-k="button"></a>
    <p class="note" data-k="note"></p>
  </div>
  <nav class="langs" id="langs"></nav>
</main>
<script>
(function () {
  "use strict";
  var T = {
    en: { name: "English", title: "Support LocalGames",
      intro: "LocalGames is a small independent project, made in free time.",
      p1: "Free, no ads, no tracking, no data collection.", p2: "All games in one tiny app – under 2 MB.", p3: "Works offline, on old phones too.",
      button: "Buy me a coffee", note: "A coffee is a thank-you, nothing more: it unlocks nothing, and the app works the same without it." },
    de: { name: "Deutsch", title: "LocalGames unterstützen",
      intro: "LocalGames ist ein kleines unabhängiges Projekt, in der Freizeit entstanden.",
      p1: "Kostenlos, ohne Werbung, ohne Tracking, ohne Datensammlung.", p2: "Alle Spiele in einer winzigen App – unter 2 MB.", p3: "Läuft offline, auch auf alten Handys.",
      button: "Spendier mir einen Kaffee", note: "Ein Kaffee ist ein Dankeschön, mehr nicht: Er schaltet nichts frei, und die App funktioniert ohne ihn genauso." },
    fr: { name: "Français", title: "Soutenir LocalGames",
      intro: "LocalGames est un petit projet indépendant, réalisé sur le temps libre.",
      p1: "Gratuit, sans pub, sans pistage, sans collecte de données.", p2: "Tous les jeux dans une toute petite app – moins de 2 Mo.", p3: "Fonctionne hors ligne, même sur de vieux téléphones.",
      button: "Offrez-moi un café", note: "Un café est un simple merci : il ne débloque rien, et l’app fonctionne pareil sans lui." },
    es: { name: "Español", title: "Apoya LocalGames",
      intro: "LocalGames es un pequeño proyecto independiente, hecho en el tiempo libre.",
      p1: "Gratis, sin anuncios, sin rastreo, sin recopilar datos.", p2: "Todos los juegos en una app diminuta: menos de 2 MB.", p3: "Funciona sin conexión, también en móviles antiguos.",
      button: "Invítame a un café", note: "Un café es solo un agradecimiento: no desbloquea nada y la app funciona igual sin él." },
    it: { name: "Italiano", title: "Sostieni LocalGames",
      intro: "LocalGames è un piccolo progetto indipendente, nato nel tempo libero.",
      p1: "Gratis, senza pubblicità, senza tracciamento, senza raccolta di dati.", p2: "Tutti i giochi in un’app minuscola: meno di 2 MB.", p3: "Funziona offline, anche su telefoni vecchi.",
      button: "Offrimi un caffè", note: "Un caffè è solo un grazie: non sblocca nulla e l’app funziona allo stesso modo anche senza." },
    ru: { name: "Русский", title: "Поддержать LocalGames",
      intro: "LocalGames – небольшой независимый проект, сделанный в свободное время.",
      p1: "Бесплатно, без рекламы, без слежки, без сбора данных.", p2: "Все игры в одном крошечном приложении – меньше 2 МБ.", p3: "Работает офлайн, даже на старых телефонах.",
      button: "Угостить кофе", note: "Кофе – это просто спасибо: он ничего не открывает, и приложение работает так же и без него." }
  };
  function pick() {
    var m = /[?&]lang=([a-z]{2})/.exec(location.search);
    if (m && T[m[1]]) return m[1];
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).toLowerCase().split("-")[0];
      if (T[l]) return l;
    }
    return "en";
  }
  function show(lang) {
    var s = T[lang];
    document.documentElement.lang = lang;
    document.title = s.title;
    var els = document.querySelectorAll("[data-k]");
    for (var i = 0; i < els.length; i++) els[i].textContent = s[els[i].getAttribute("data-k")];
    var nav = document.getElementById("langs");
    nav.innerHTML = "";
    Object.keys(T).forEach(function (code) {
      var a = document.createElement("a");
      a.href = "?lang=" + code;
      a.textContent = T[code].name;
      if (code === lang) a.className = "on";
      nav.appendChild(a);
    });
  }
  show(pick());
})();
</script>
</body>
</html>
